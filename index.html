<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planning — Zacharie</title>
<meta name="theme-color" content="#101418">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F1F3F2;
  --ink:#101418;
  --muted:#6E7A82;
  --line:#D8DEDC;
  --card:#FFFFFF;
  --nf:#2F6DA8;
  --seche:#A85F1C;
  --sucree:#B23A63;
  --cave:#65409B;
  --brasserie:#2C7A57;
  --autre:#4C5A63;
  --repos:#AAB4B8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:"Bricolage Grotesque",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding:28px 18px 64px;
}
.wrap{max-width:660px;margin:0 auto}

/* ---------- en-tête ---------- */
.eyebrow{
  font-family:"IBM Plex Mono",monospace;
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);margin-bottom:10px;
}
h1{font-size:clamp(30px,8vw,44px);font-weight:800;letter-spacing:-.03em;line-height:1}
.tagline{color:var(--muted);font-size:14px;margin-top:8px}

/* ---------- semaine ---------- */
.week{margin-top:34px}
.week-head{
  display:flex;align-items:baseline;justify-content:space-between;
  gap:12px;padding-bottom:10px;border-bottom:2px solid var(--ink);
}
.week-title{font-size:19px;font-weight:700;letter-spacing:-.01em}
.week-total{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--muted);white-space:nowrap}

/* ---------- jour ---------- */
.day{
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:13px 15px;margin-top:10px;
}
.day.off{background:transparent;border-style:dashed}
.day-top{display:flex;align-items:center;gap:12px}
.dnum{
  font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:20px;
  min-width:2ch;text-align:right;font-variant-numeric:tabular-nums;
}
.dname{font-size:15px;font-weight:700;text-transform:capitalize}
.day.off .dnum,.day.off .dname{color:var(--muted)}
.tag{
  margin-left:auto;font-family:"IBM Plex Mono",monospace;
  font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  padding:3px 8px;border-radius:99px;color:#fff;background:var(--autre);
}
.tag.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}

/* ---------- barre horaire (l'élément signature) ---------- */
.bar{position:relative;height:30px;margin-top:11px}
.rail{position:absolute;inset:11px 0 auto 0;height:8px;background:#E7EBEA;border-radius:99px}
.block{position:absolute;top:8px;height:14px;border-radius:99px;background:var(--autre)}
.ticks{position:absolute;left:0;right:0;bottom:-2px;height:12px}
.tick{
  position:absolute;transform:translateX(-50%);
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;color:var(--muted);
}
.hours{
  margin-top:9px;display:flex;flex-wrap:wrap;gap:8px;
  font-family:"IBM Plex Mono",monospace;font-size:13px;font-variant-numeric:tabular-nums;
}
.hours span{background:#EEF1F0;border-radius:6px;padding:2px 7px}
.note{margin-top:7px;font-size:13px;color:var(--muted)}

/* ---------- bouton ---------- */
.ics{
  display:block;width:100%;margin-top:14px;padding:12px;
  background:var(--ink);color:var(--paper);border:none;border-radius:10px;
  font-family:"Bricolage Grotesque",sans-serif;font-size:14px;font-weight:700;
  cursor:pointer;
}
.ics:active{opacity:.75}
.ics:focus-visible{outline:3px solid var(--nf);outline-offset:2px}

/* ---------- états ---------- */
.state{
  margin-top:34px;padding:20px;border:1px dashed var(--line);border-radius:12px;
  color:var(--muted);font-size:14px;line-height:1.5;
}
.state strong{display:block;color:var(--ink);font-size:15px;margin-bottom:5px}
footer{
  margin-top:40px;padding-top:14px;border-top:1px solid var(--line);
  font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);
}
@media (prefers-reduced-motion:no-preference){
  .day{animation:rise .4s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
}
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">079 · Univers Sec &amp; Non Food</p>
  <h1>Mon planning</h1>
  <p class="tagline">Mis à jour automatiquement depuis le tableau.</p>
  <div id="app"><p class="state">Chargement…</p></div>
  <footer id="foot"></footer>
</div>

<script>
/* ====================================================================
   SEULE LIGNE À MODIFIER UN JOUR : l'adresse du tableau publié.
   ==================================================================== */
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTNo85oytJdVPxASHlqPyHowMSs8kqAPlr3h9xXE1js6UrrjAeMTRjFlos5qZ038J8PA--y96bBiOue/pub?output=csv";

const COULEURS = {nf:"--nf", seche:"--seche", sucree:"--sucree", cave:"--cave",
                  brasserie:"--brasserie", brass:"--brasserie"};
const JOURS = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
const MOIS  = ["janvier","février","mars","avril","mai","juin","juillet",
               "août","septembre","octobre","novembre","décembre"];

const sansAccent = s => (s||"").toString().normalize("NFD")
  .replace(/[\u0300-\u036f]/g,"").trim().toLowerCase();

/* --- lecture du CSV --------------------------------------------------- */
function decouper(ligne){
  const out=[]; let cur="", guill=false;
  for(let i=0;i<ligne.length;i++){
    const c=ligne[i];
    if(c==='"'){ if(guill && ligne[i+1]==='"'){cur+='"';i++;} else guill=!guill; }
    else if(c==="," && !guill){ out.push(cur); cur=""; }
    else cur+=c;
  }
  out.push(cur); return out.map(v=>v.trim());
}

function minutes(h){
  const m=(h||"").match(/(\d{1,2})\s*[:h]\s*(\d{2})/);
  return m ? (+m[1])*60 + (+m[2]) : null;
}
const hhmm = m => String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");

function lire(csv){
  const lignes = csv.split(/\r?\n/).filter(l=>l.trim()!=="");
  const entetes = decouper(lignes[0]).map(sansAccent);
  const col = nom => entetes.findIndex(e=>e===nom);
  const iDate=col("date"), iStat=col("statut"), iRayon=col("rayon"), iNote=col("note");
  const iDm=col("debut matin"), iFm=col("fin matin"),
        iDa=col("debut aprem"), iFa=col("fin aprem");

  return lignes.slice(1).map(l=>{
    const c = decouper(l);
    const iso = (c[iDate]||"").slice(0,10);
    if(!/^\d{4}-\d{2}-\d{2}$/.test(iso)) return null;
    const seg=[];
    [[iDm,iFm],[iDa,iFa]].forEach(([a,b])=>{
      const d=minutes(c[a]), f=minutes(c[b]);
      if(d!==null && f!==null && f>d) seg.push({d,f});
    });
    return {
      iso,
      date: new Date(iso+"T12:00:00"),
      statut: sansAccent(c[iStat]),
      rayon: (c[iRayon]||"").trim(),
      note: (c[iNote]||"").trim(),
      seg
    };
  }).filter(Boolean).sort((a,b)=>a.iso<b.iso?-1:1);
}

/* --- regroupement par semaine ----------------------------------------- */
function parSemaine(jours){
  const map = new Map();
  jours.forEach(j=>{
    const d = new Date(j.date);
    const dec = (d.getDay()+6)%7;          // 0 = lundi
    d.setDate(d.getDate()-dec);
    const cle = d.toISOString().slice(0,10);
    if(!map.has(cle)) map.set(cle,{lundi:d, jours:[]});
    map.get(cle).jours.push(j);
  });
  return [...map.values()];
}

/* --- affichage --------------------------------------------------------- */
function barre(seg, min, max){
  const largeur = max-min;
  const pos = v => ((v-min)/largeur*100).toFixed(2)+"%";
  let html = '<div class="bar"><div class="rail"></div>';
  seg.forEach(s=>{
    html += `<div class="block" style="left:${pos(s.d)};width:${((s.f-s.d)/largeur*100).toFixed(2)}%"></div>`;
  });
  html += '<div class="ticks">';
  for(let h=Math.ceil(min/120)*120; h<=max; h+=120){
    html += `<span class="tick" style="left:${pos(h)}">${Math.floor(h/60)}h</span>`;
  }
  return html + "</div></div>";
}

function carteJour(j, min, max){
  const travaille = j.seg.length>0;
  const jour = JOURS[j.date.getDay()];
  const num  = j.date.getDate();
  const cle  = sansAccent(j.rayon).replace(/[^a-z]/g,"");
  const coul = COULEURS[cle] ? `var(${COULEURS[cle]})` : "var(--autre)";

  let etiquette = "";
  if(travaille && j.rayon) etiquette = `<span class="tag" style="background:${coul}">${j.rayon}</span>`;
  else if(!travaille){
    const l = j.statut==="ferie" ? "Férié" : (j.rayon || "Repos");
    etiquette = `<span class="tag ghost">${l}</span>`;
  }

  let html = `<article class="day${travaille?"":" off"}">
    <div class="day-top"><span class="dnum">${num}</span>
    <span class="dname">${jour}</span>${etiquette}</div>`;

  if(travaille){
    html += barre(j.seg, min, max);
    html += '<div class="hours">' +
      j.seg.map(s=>`<span>${hhmm(s.d)} – ${hhmm(s.f)}</span>`).join("") + "</div>";
    j.seg.forEach((s,i)=>{
      const suiv = j.seg[i+1];
      if(suiv && suiv.d - s.f >= 20)
        html += `<p class="note">Coupure de ${Math.round((suiv.d-s.f)/60*10)/10} h.</p>`;
    });
  }
  if(j.note) html += `<p class="note">${j.note}</p>`;
  return html + "</article>";
}

function rendre(jours){
  const app = document.getElementById("app");
  if(!jours.length){
    app.innerHTML = `<div class="state"><strong>Le tableau est vide.</strong>
      Ajoute des lignes dans la feuille, la page les affichera.</div>`;
    return;
  }
  const semaines = parSemaine(jours);
  app.innerHTML = semaines.map((sem,idx)=>{
    const tous = sem.jours.flatMap(j=>j.seg);
    let min = tous.length ? Math.min(...tous.map(s=>s.d)) : 480;
    let max = tous.length ? Math.max(...tous.map(s=>s.f)) : 1200;
    min = Math.floor(min/60)*60 - 30;
    max = Math.ceil(max/60)*60 + 30;

    const total = tous.reduce((a,s)=>a+(s.f-s.d),0)/60;
    const d1 = sem.jours[0].date, d2 = sem.jours[sem.jours.length-1].date;
    const titre = `Semaine du ${d1.getDate()} au ${d2.getDate()} ${MOIS[d2.getMonth()]}`;

    return `<section class="week">
      <div class="week-head">
        <h2 class="week-title">${titre}</h2>
        <span class="week-total">${total.toFixed(1).replace(".",",")} h</span>
      </div>
      ${sem.jours.map(j=>carteJour(j,min,max)).join("")}
      <button class="ics" data-sem="${idx}">Ajouter cette semaine à mon agenda</button>
    </section>`;
  }).join("");

  app.querySelectorAll(".ics").forEach(b=>{
    b.addEventListener("click",()=>agenda(semaines[+b.dataset.sem]));
  });

  const maj = new Date();
  document.getElementById("foot").textContent =
    "Dernière lecture du tableau : " + maj.toLocaleString("fr-FR",
    {day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
}

/* --- export vers l'agenda ---------------------------------------------- */
function agenda(sem){
  const l = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//planning//FR","CALSCALE:GREGORIAN"];
  const tampon = new Date().toISOString().replace(/[-:]/g,"").split(".")[0]+"Z";
  sem.jours.forEach(j=>{
    const d = j.iso.replace(/-/g,"");
    j.seg.forEach((s,i)=>{
      l.push("BEGIN:VEVENT",
        "UID:"+d+"-"+i+"@planning",
        "DTSTAMP:"+tampon,
        "DTSTART:"+d+"T"+hhmm(s.d).replace(":","")+"00",
        "DTEND:"+d+"T"+hhmm(s.f).replace(":","")+"00",
        "SUMMARY:Travail"+(j.rayon?" · "+j.rayon:""),
        "END:VEVENT");
    });
  });
  l.push("END:VCALENDAR");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([l.join("\r\n")],{type:"text/calendar"}));
  a.download = "planning.ics";
  document.body.appendChild(a); a.click(); a.remove();
}

/* --- démarrage ---------------------------------------------------------- */
fetch(CSV_URL + "&maj=" + Date.now())
  .then(r=>{ if(!r.ok) throw new Error(r.status); return r.text(); })
  .then(t=>rendre(lire(t)))
  .catch(()=>{
    document.getElementById("app").innerHTML =
      `<div class="state"><strong>Le tableau n'a pas pu être lu.</strong>
       Vérifie dans Google Sheets que le fichier est toujours publié
       sur le web au format CSV, puis recharge la page.</div>`;
  });
</script>
</body>
</html>
